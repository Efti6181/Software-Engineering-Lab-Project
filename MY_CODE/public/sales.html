<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sales - Business Inventory System</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css" rel="stylesheet">
  <link href="/css/style.css" rel="stylesheet">
</head>
<body>
  <div id="app-layout"></div>
  <template id="page-custom">
    <div class="container-fluid">
      <h4 class="mb-3">Sales</h4>
      <div class="card mb-3">
        <div class="card-body">
          <div class="row g-2">
            <div class="col-md-4"><input type="text" class="form-control" id="search" placeholder="Search invoice or customer..."></div>
            <div class="col-md-2"><select class="form-select" id="filter-status"><option value="">All Status</option><option value="completed">Completed</option><option value="voided">Voided</option><option value="returned">Returned</option></select></div>
            <div class="col-md-2"><select class="form-select" id="filter-payment"><option value="">All Payment</option><option value="paid">Paid</option><option value="partial">Partial</option><option value="unpaid">Unpaid</option></select></div>
            <div class="col-md-2"><input type="date" class="form-control" id="filter-date"></div>
            <div class="col-md-2"><button class="btn btn-outline-secondary w-100" id="search-btn"><i class="fas fa-search"></i> Search</button></div>
          </div>
        </div>
      </div>
      <div class="card">
        <div class="card-body table-card">
          <table class="data-table" id="data-table">
            <thead><tr><th>Invoice</th><th>Customer</th><th>Date</th><th>Total</th><th>Paid</th><th>Due</th><th>Payment</th><th>Status</th><th>Cashier</th><th>Actions</th></tr></thead>
            <tbody id="data-body"></tbody>
          </table>
          <div id="pagination" class="mt-3"></div>
        </div>
      </div>
    </div>
    <div class="modal fade" id="view-modal" tabindex="-1">
      <div class="modal-dialog modal-lg"><div class="modal-content">
        <div class="modal-header"><h5 class="modal-title">Sale Details</h5><button class="btn-close" data-bs-dismiss="modal"></button></div>
        <div class="modal-body" id="view-body"></div>
      </div></div>
    </div>
  </template>
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="/js/app.js"></script>
  <script src="/js/layout.js"></script>
  <script src="/js/sales.js"></script>
</body>
</html>
