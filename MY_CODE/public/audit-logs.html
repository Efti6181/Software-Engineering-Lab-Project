<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Audit Logs - Business Inventory System</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css" rel="stylesheet">
  <link href="/css/style.css" rel="stylesheet">
</head>
<body>
  <div id="app-layout"></div>
  <template id="page-custom">
    <div class="container-fluid">
      <h4 class="mb-3">Audit Logs</h4>
      <div class="card mb-3">
        <div class="card-body">
          <div class="row g-2">
            <div class="col-md-6"><input type="text" class="form-control" id="search" placeholder="Search by action, user or description..."></div>
            <div class="col-md-3"><select class="form-select" id="filter-module"><option value="">All Modules</option><option value="auth">Auth</option><option value="products">Products</option><option value="sales">Sales</option><option value="purchases">Purchases</option><option value="inventory">Inventory</option><option value="returns">Returns</option><option value="payments">Payments</option><option value="expenses">Expenses</option><option value="users">Users</option><option value="settings">Settings</option><option value="categories">Categories</option><option value="brands">Brands</option><option value="customers">Customers</option><option value="suppliers">Suppliers</option></select></div>
            <div class="col-md-3"><button class="btn btn-outline-secondary w-100" id="search-btn"><i class="fas fa-search"></i> Search</button></div>
          </div>
        </div>
      </div>
      <div class="card">
        <div class="card-body table-card">
          <table class="data-table" id="data-table">
            <thead><tr><th>Date/Time</th><th>User</th><th>Action</th><th>Module</th><th>Description</th><th>IP</th></tr></thead>
            <tbody id="data-body"></tbody>
          </table>
          <div id="pagination" class="mt-3"></div>
        </div>
      </div>
    </div>
  </template>
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="/js/app.js"></script>
  <script src="/js/layout.js"></script>
  <script src="/js/audit-logs.js"></script>
</body>
</html>
