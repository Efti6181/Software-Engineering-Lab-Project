<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Reports - Business Inventory System</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css" rel="stylesheet">
  <link href="/css/style.css" rel="stylesheet">
</head>
<body>
  <div id="app-layout"></div>
  <template id="page-custom">
    <div class="container-fluid">
      <h4 class="mb-3">Reports</h4>
      <div class="card mb-3">
        <div class="card-body">
          <div class="row g-2">
            <div class="col-md-4">
              <label class="form-label">Report Type</label>
              <select class="form-select" id="report-type">
                <option value="sales">Sales Report</option>
                <option value="purchases">Purchase Report</option>
                <option value="profit_loss">Profit/Loss Report</option>
                <option value="expenses">Expense Report</option>
                <option value="inventory">Inventory Report</option>
                <option value="stock_movements">Stock Movement Report</option>
                <option value="low_stock">Low Stock Report</option>
                <option value="out_of_stock">Out of Stock Report</option>
                <option value="customer_due">Customer Due Report</option>
                <option value="supplier_due">Supplier Due Report</option>
                <option value="top_products">Top Selling Products</option>
                <option value="payments">Payment Report</option>
              </select>
            </div>
            <div class="col-md-3">
              <label class="form-label">Date Range</label>
              <select class="form-select" id="date-range">
                <option value="today">Today</option>
                <option value="yesterday">Yesterday</option>
                <option value="this_week">This Week</option>
                <option value="this_month" selected>This Month</option>
                <option value="this_year">This Year</option>
                <option value="custom">Custom Range</option>
              </select>
            </div>
            <div class="col-md-2" id="start-date-wrap" style="display:none">
              <label class="form-label">Start Date</label><input type="date" class="form-control" id="start_date">
            </div>
            <div class="col-md-2" id="end-date-wrap" style="display:none">
              <label class="form-label">End Date</label><input type="date" class="form-control" id="end_date">
            </div>
            <div class="col-md-1 d-flex align-items-end"><button class="btn btn-primary w-100" id="generate-btn"><i class="fas fa-play"></i></button></div>
          </div>
        </div>
      </div>
      <div class="card">
        <div class="card-header d-flex justify-content-between align-items-center">
          <h5 class="mb-0" id="report-title">Sales Report</h5>
          <div>
            <button class="btn btn-sm btn-outline-secondary me-2" onclick="window.print()"><i class="fas fa-print"></i> Print</button>
            <button class="btn btn-sm btn-success" id="csv-btn"><i class="fas fa-file-csv"></i> Export CSV</button>
          </div>
        </div>
        <div class="card-body table-card">
          <table class="data-table" id="report-table">
            <thead><tr id="report-header"></tr></thead>
            <tbody id="report-body"></tbody>
          </table>
        </div>
      </div>
    </div>
  </template>
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="/js/app.js"></script>
  <script src="/js/layout.js"></script>
  <script src="/js/reports.js"></script>
</body>
</html>
