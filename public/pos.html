<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>POS - Business Inventory System</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css" rel="stylesheet">
  <link href="/css/style.css" rel="stylesheet">
</head>
<body>
  <div id="app-layout"></div>
  <template id="page-custom">
    <div class="container-fluid">
      <div class="pos-layout">
        <div>
          <div class="card mb-3">
            <div class="card-body">
              <input type="text" class="form-control form-control-lg" id="product-search" placeholder="Search by name, SKU or barcode..." autofocus>
            </div>
          </div>
          <div class="pos-product-grid" id="product-grid"></div>
        </div>
        <div class="cart-panel">
          <div class="card">
            <div class="card-header"><h5 class="mb-0"><i class="fas fa-shopping-cart"></i> Cart</h5></div>
            <div class="card-body">
              <div class="mb-3">
                <label class="form-label">Customer</label>
                <select class="form-select" id="customer_id"></select>
              </div>
              <div id="cart-items" style="max-height:300px;overflow-y:auto"></div>
              <hr>
              <div class="row g-2 mb-2">
                <div class="col-6"><label class="form-label small">Discount</label><input type="number" step="0.01" class="form-control form-control-sm" id="discount_amount" value="0"></div>
                <div class="col-6"><label class="form-label small">Tax</label><input type="number" step="0.01" class="form-control form-control-sm" id="tax_amount" value="0"></div>
              </div>
              <div class="row g-2 mb-3">
                <div class="col-6"><label class="form-label small">Delivery Charge</label><input type="number" step="0.01" class="form-control form-control-sm" id="delivery_charge" value="0"></div>
                <div class="col-6"><label class="form-label small">Payment Method</label><select class="form-select form-select-sm" id="payment_method">
                  <option value="cash">Cash</option><option value="card">Card</option><option value="mobile_banking">Mobile Banking</option><option value="bank_transfer">Bank Transfer</option><option value="due">Due</option><option value="other">Other</option>
                </select></div>
              </div>
              <div class="mb-3">
                <label class="form-label small">Paid Amount</label>
                <input type="number" step="0.01" class="form-control form-control-sm" id="paid_amount" value="0">
              </div>
              <div class="card bg-light mb-3">
                <div class="card-body py-2">
                  <div class="d-flex justify-content-between"><span>Subtotal:</span><strong id="cart-subtotal">৳0</strong></div>
                  <div class="d-flex justify-content-between"><span>Discount:</span><strong id="cart-discount">৳0</strong></div>
                  <div class="d-flex justify-content-between"><span>Tax:</span><strong id="cart-tax">৳0</strong></div>
                  <div class="d-flex justify-content-between"><span>Delivery:</span><strong id="cart-delivery">৳0</strong></div>
                  <hr class="my-1">
                  <div class="d-flex justify-content-between"><span>Grand Total:</span><strong class="fs-5" id="cart-grand">৳0</strong></div>
                  <div class="d-flex justify-content-between"><span>Paid:</span><strong id="cart-paid">৳0</strong></div>
                  <div class="d-flex justify-content-between"><span>Due:</span><strong class="fs-5 text-danger" id="cart-due">৳0</strong></div>
                </div>
              </div>
              <button class="btn btn-primary w-100 py-2" id="checkout-btn" disabled>
                <i class="fas fa-check-circle"></i> Complete Sale
              </button>
            </div>
          </div>
        </div>
      </div>
    </div>
  </template>
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="/js/app.js"></script>
  <script src="/js/layout.js"></script>
  <script src="/js/pos.js"></script>
</body>
</html>
