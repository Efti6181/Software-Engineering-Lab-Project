<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Profile - Business Inventory System</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css" rel="stylesheet">
  <link href="/css/style.css" rel="stylesheet">
</head>
<body>
  <div id="app-layout"></div>
  <template id="page-custom">
    <div class="container-fluid" style="max-width:600px">
      <h4 class="mb-3">My Profile</h4>
      <div class="card mb-3">
        <div class="card-body text-center">
          <div class="profile-avatar mx-auto mb-3" style="width:80px;height:80px;font-size:32px" id="profile-avatar"></div>
          <h5 id="profile-name"></h5>
          <p class="text-muted mb-1" id="profile-email"></p>
          <span class="badge badge-info mt-2" id="profile-role" style="text-transform:capitalize"></span>
        </div>
      </div>
      <div class="card">
        <div class="card-header"><h5 class="mb-0">Change Password</h5></div>
        <div class="card-body">
          <form id="pw-form">
            <div class="mb-3"><label class="form-label">Current Password *</label><input type="password" class="form-control" id="current_password" required></div>
            <div class="mb-3"><label class="form-label">New Password * <small class="text-muted">(min 6 characters)</small></label><input type="password" class="form-control" id="new_password" required></div>
            <div class="mb-3"><label class="form-label">Confirm New Password *</label><input type="password" class="form-control" id="confirm_password" required></div>
            <button type="button" class="btn btn-primary" id="change-pw-btn"><i class="fas fa-key"></i> Change Password</button>
          </form>
        </div>
      </div>
    </div>
  </template>
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="/js/app.js"></script>
  <script src="/js/layout.js"></script>
  <script src="/js/profile.js"></script>
</body>
</html>
