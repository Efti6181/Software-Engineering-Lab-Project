<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Settings - Business Inventory System</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css" rel="stylesheet">
  <link href="/css/style.css" rel="stylesheet">
</head>
<body>
  <div id="app-layout"></div>
  <template id="page-custom">
    <div class="container-fluid" style="max-width:800px">
      <h4 class="mb-3">Business Settings</h4>
      <div class="card">
        <div class="card-body">
          <form id="settings-form">
            <h6 class="mb-3 text-primary">Business Information</h6>
            <div class="row g-3 mb-3">
              <div class="col-md-6"><label class="form-label">Business Name</label><input type="text" class="form-control" id="business_name"></div>
              <div class="col-md-6"><label class="form-label">Logo URL</label><input type="text" class="form-control" id="logo_url" placeholder="/uploads/logo.png"></div>
              <div class="col-md-6"><label class="form-label">Phone</label><input type="text" class="form-control" id="phone"></div>
              <div class="col-md-6"><label class="form-label">Email</label><input type="email" class="form-control" id="email"></div>
              <div class="col-12"><label class="form-label">Address</label><textarea class="form-control" id="address" rows="2"></textarea></div>
            </div>
            <h6 class="mb-3 text-primary">Currency & Tax</h6>
            <div class="row g-3 mb-3">
              <div class="col-md-4"><label class="form-label">Currency Symbol</label><input type="text" class="form-control" id="currency_symbol" value="৳"></div>
              <div class="col-md-4"><label class="form-label">Currency Code</label><input type="text" class="form-control" id="currency_code" value="BDT"></div>
              <div class="col-md-4"><label class="form-label">Default Tax %</label><input type="number" step="0.01" class="form-control" id="default_tax_percent" value="0"></div>
            </div>
            <h6 class="mb-3 text-primary">Invoice & Inventory</h6>
            <div class="row g-3 mb-3">
              <div class="col-md-4"><label class="form-label">Invoice Prefix</label><input type="text" class="form-control" id="invoice_prefix" value="INV"></div>
              <div class="col-md-4"><label class="form-label">Default Low Stock Level</label><input type="number" class="form-control" id="default_low_stock_level" value="5"></div>
              <div class="col-md-4"><label class="form-label">Allow Negative Stock</label><select class="form-select" id="allow_negative_stock"><option value="false">No (Recommended)</option><option value="true">Yes</option></select></div>
              <div class="col-12"><label class="form-label">Invoice Footer</label><textarea class="form-control" id="invoice_footer" rows="2" placeholder="Thank you for your business!"></textarea></div>
            </div>
            <button type="button" class="btn btn-primary" id="save-btn"><i class="fas fa-save"></i> Save Settings</button>
          </form>
        </div>
      </div>
    </div>
  </template>
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="/js/app.js"></script>
  <script src="/js/layout.js"></script>
  <script src="/js/settings.js"></script>
</body>
</html>
