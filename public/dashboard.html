<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Dashboard - Business Inventory System</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css" rel="stylesheet">
  <link href="/css/style.css" rel="stylesheet">
</head>
<body>
  <div id="app-layout"></div>
  <template id="page-custom">
    <div class="container-fluid">
      <!-- Stat cards row 1 -->
      <div class="row g-3 mb-3">
        <div class="col-6 col-lg-3">
          <div class="stat-card">
            <div class="stat-icon blue"><i class="fas fa-shopping-bag"></i></div>
            <div class="stat-info">
              <div class="stat-label">Today's Sales</div>
              <div class="stat-value" id="today-sales">৳0</div>
              <div class="stat-sub" id="today-paid">Paid: ৳0</div>
            </div>
          </div>
        </div>
        <div class="col-6 col-lg-3">
          <div class="stat-card">
            <div class="stat-icon teal"><i class="fas fa-calendar"></i></div>
            <div class="stat-info">
              <div class="stat-label">Monthly Sales</div>
              <div class="stat-value" id="month-sales">৳0</div>
              <div class="stat-sub" id="month-paid">Paid: ৳0</div>
            </div>
          </div>
        </div>
        <div class="col-6 col-lg-3">
          <div class="stat-card">
            <div class="stat-icon orange"><i class="fas fa-truck"></i></div>
            <div class="stat-info">
              <div class="stat-label">Total Purchases</div>
              <div class="stat-value" id="total-purchases">৳0</div>
              <div class="stat-sub">All time</div>
            </div>
          </div>
        </div>
        <div class="col-6 col-lg-3">
          <div class="stat-card">
            <div class="stat-icon green"><i class="fas fa-chart-line"></i></div>
            <div class="stat-info">
              <div class="stat-label">Gross Profit</div>
              <div class="stat-value" id="gross-profit">৳0</div>
              <div class="stat-sub" id="net-profit">Net: ৳0</div>
            </div>
          </div>
        </div>
      </div>

      <!-- Stat cards row 2 -->
      <div class="row g-3 mb-3">
        <div class="col-6 col-lg-2">
          <div class="stat-card">
            <div class="stat-icon red"><i class="fas fa-wallet"></i></div>
            <div class="stat-info">
              <div class="stat-label">Expenses</div>
              <div class="stat-value" id="expenses" style="font-size:18px">৳0</div>
            </div>
          </div>
        </div>
        <div class="col-6 col-lg-2">
          <div class="stat-card">
            <div class="stat-icon blue"><i class="fas fa-box"></i></div>
            <div class="stat-info">
              <div class="stat-label">Products</div>
              <div class="stat-value" id="total-products" style="font-size:18px">0</div>
            </div>
          </div>
        </div>
        <div class="col-6 col-lg-2">
          <div class="stat-card">
            <div class="stat-icon teal"><i class="fas fa-warehouse"></i></div>
            <div class="stat-info">
              <div class="stat-label">Inventory Value</div>
              <div class="stat-value" id="inventory-value" style="font-size:18px">৳0</div>
            </div>
          </div>
        </div>
        <div class="col-6 col-lg-2">
          <div class="stat-card">
            <div class="stat-icon orange"><i class="fas fa-users"></i></div>
            <div class="stat-info">
              <div class="stat-label">Customers</div>
              <div class="stat-value" id="total-customers" style="font-size:18px">0</div>
            </div>
          </div>
        </div>
        <div class="col-6 col-lg-2">
          <div class="stat-card">
            <div class="stat-icon green"><i class="fas fa-truck"></i></div>
            <div class="stat-info">
              <div class="stat-label">Suppliers</div>
              <div class="stat-value" id="total-suppliers" style="font-size:18px">0</div>
            </div>
          </div>
        </div>
        <div class="col-6 col-lg-2">
          <div class="stat-card">
            <div class="stat-icon red"><i class="fas fa-exclamation-triangle"></i></div>
            <div class="stat-info">
              <div class="stat-label">Low / Out of Stock</div>
              <div class="stat-value" id="stock-alerts" style="font-size:18px">0 / 0</div>
            </div>
          </div>
        </div>
      </div>

      <!-- Dues row -->
      <div class="row g-3 mb-4">
        <div class="col-6 col-lg-3">
          <div class="stat-card">
            <div class="stat-icon orange"><i class="fas fa-hand-holding-usd"></i></div>
            <div class="stat-info">
              <div class="stat-label">Customer Due</div>
              <div class="stat-value" id="customer-due" style="font-size:18px">৳0</div>
            </div>
          </div>
        </div>
        <div class="col-6 col-lg-3">
          <div class="stat-card">
            <div class="stat-icon red"><i class="fas fa-money-bill-wave"></i></div>
            <div class="stat-info">
              <div class="stat-label">Supplier Due</div>
              <div class="stat-value" id="supplier-due" style="font-size:18px">৳0</div>
            </div>
          </div>
        </div>
      </div>

      <!-- Charts -->
      <div class="row g-3 mb-4">
        <div class="col-lg-8">
          <div class="card">
            <div class="card-header"><h5>Net Sales vs Net Purchases (Last 30 Days)</h5></div>
            <div class="card-body"><canvas id="chart-sales-purchase" height="100"></canvas></div>
          </div>
        </div>
        <div class="col-lg-4">
          <div class="card">
            <div class="card-header"><h5>Expense Breakdown</h5></div>
            <div class="card-body"><canvas id="chart-expenses" height="180"></canvas></div>
          </div>
        </div>
      </div>
      <div class="row g-3 mb-4">
        <div class="col-lg-6">
          <div class="card">
            <div class="card-header"><h5>Monthly Net Sales (Last 12 Months)</h5></div>
            <div class="card-body"><canvas id="chart-monthly" height="120"></canvas></div>
          </div>
        </div>
        <div class="col-lg-6">
          <div class="card">
            <div class="card-header"><h5>Top Selling Products (Last 30 Days)</h5></div>
            <div class="card-body"><canvas id="chart-top-products" height="120"></canvas></div>
          </div>
        </div>
      </div>

      <!-- Recent activity -->
      <div class="row g-3">
        <div class="col-lg-6">
          <div class="card">
            <div class="card-header"><h5>Recent Sales</h5></div>
            <div class="card-body table-card">
              <table class="data-table" id="recent-sales-table">
                <thead><tr><th>Invoice</th><th>Customer</th><th>Date</th><th>Total</th><th>Status</th></tr></thead>
                <tbody></tbody>
              </table>
            </div>
          </div>
        </div>
        <div class="col-lg-6">
          <div class="card">
            <div class="card-header"><h5>Low Stock Products</h5></div>
            <div class="card-body table-card">
              <table class="data-table" id="low-stock-table">
                <thead><tr><th>Product</th><th>SKU</th><th>Stock</th><th>Min</th></tr></thead>
                <tbody></tbody>
              </table>
            </div>
          </div>
        </div>
      </div>
      <div class="row g-3 mt-1">
        <div class="col-12">
          <div class="card">
            <div class="card-header"><h5>Recent Activity</h5></div>
            <div class="card-body table-card">
              <table class="data-table" id="recent-logs-table">
                <thead><tr><th>User</th><th>Action</th><th>Module</th><th>Description</th><th>Time</th></tr></thead>
                <tbody></tbody>
              </table>
            </div>
          </div>
        </div>
      </div>
    </div>
  </template>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.1/dist/chart.umd.min.js"></script>
  <script src="/js/app.js"></script>
  <script src="/js/layout.js"></script>
  <script src="/js/dashboard.js"></script>
</body>
</html>
