<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Users - Business Inventory System</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css" rel="stylesheet">
  <link href="/css/style.css" rel="stylesheet">
</head>
<body>
  <div id="app-layout"></div>
  <template id="page-custom">
    <div class="container-fluid">
      <div class="d-flex justify-content-between align-items-center mb-3">
        <h4 class="mb-0">Users</h4>
        <button class="btn btn-primary" id="add-btn"><i class="fas fa-plus"></i> Add User</button>
      </div>
      <div class="card mb-3">
        <div class="card-body">
          <div class="row g-2">
            <div class="col-md-6"><input type="text" class="form-control" id="search" placeholder="Search users..."></div>
            <div class="col-md-3"><select class="form-select" id="filter-role"><option value="">All Roles</option><option value="admin">Admin</option><option value="staff">Staff</option></select></div>
            <div class="col-md-3"><button class="btn btn-outline-secondary w-100" id="search-btn"><i class="fas fa-search"></i> Search</button></div>
          </div>
        </div>
      </div>
      <div class="card">
        <div class="card-body table-card">
          <table class="data-table" id="data-table">
            <thead><tr><th>ID</th><th>Name</th><th>Email</th><th>Phone</th><th>Role</th><th>Status</th><th>Last Login</th><th>Actions</th></tr></thead>
            <tbody id="data-body"></tbody>
          </table>
        </div>
      </div>
    </div>
    <div class="modal fade" id="form-modal" tabindex="-1">
      <div class="modal-dialog"><div class="modal-content">
        <div class="modal-header"><h5 class="modal-title" id="modal-title">Add User</h5><button class="btn-close" data-bs-dismiss="modal"></button></div>
        <div class="modal-body"><form id="user-form">
          <input type="hidden" id="edit-id">
          <div class="mb-3"><label class="form-label">Name *</label><input type="text" class="form-control" id="name" required></div>
          <div class="mb-3"><label class="form-label">Email *</label><input type="email" class="form-control" id="email" required></div>
          <div class="mb-3"><label class="form-label">Phone</label><input type="text" class="form-control" id="phone"></div>
          <div class="mb-3"><label class="form-label">Password <small id="pw-hint" class="text-muted">*</small></label><input type="password" class="form-control" id="password"></div>
          <div class="mb-3"><label class="form-label">Role *</label><select class="form-select" id="role"><option value="staff">Staff</option><option value="admin">Admin</option></select></div>
          <div class="mb-3"><label class="form-label">Status</label><select class="form-select" id="status"><option value="active">Active</option><option value="inactive">Inactive</option></select></div>
        </form></div>
        <div class="modal-footer"><button class="btn btn-secondary" data-bs-dismiss="modal">Cancel</button><button class="btn btn-primary" id="save-btn">Save</button></div>
      </div></div>
    </div>
  </template>
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="/js/app.js"></script>
  <script src="/js/layout.js"></script>
  <script src="/js/users.js"></script>
</body>
</html>
