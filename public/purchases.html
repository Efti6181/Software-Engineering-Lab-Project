<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Purchases - Business Inventory System</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css" rel="stylesheet">
  <link href="/css/style.css" rel="stylesheet">
</head>
<body>
  <div id="app-layout"></div>
  <template id="page-custom">
    <div class="container-fluid">
      <div class="d-flex justify-content-between align-items-center mb-3">
        <h4 class="mb-0">Purchases</h4>
        <button class="btn btn-primary" id="add-btn"><i class="fas fa-plus"></i> New Purchase</button>
      </div>
      <div class="card mb-3">
        <div class="card-body">
          <div class="row g-2">
            <div class="col-md-6"><input type="text" class="form-control" id="search" placeholder="Search by purchase number or supplier..."></div>
            <div class="col-md-3"><select class="form-select" id="filter-status">
              <option value="">All Status</option><option value="draft">Draft</option><option value="ordered">Ordered</option>
              <option value="received">Received</option><option value="cancelled">Cancelled</option>
            </select></div>
            <div class="col-md-3"><button class="btn btn-outline-secondary w-100" id="search-btn"><i class="fas fa-search"></i> Search</button></div>
          </div>
        </div>
      </div>
      <div class="card">
        <div class="card-body table-card">
          <table class="data-table" id="data-table">
            <thead><tr><th>Number</th><th>Supplier</th><th>Date</th><th>Total</th><th>Paid</th><th>Due</th><th>Status</th><th>Payment</th><th>Actions</th></tr></thead>
            <tbody id="data-body"></tbody>
          </table>
          <div id="pagination" class="mt-3"></div>
        </div>
      </div>
    </div>

    <div class="modal fade" id="form-modal" tabindex="-1">
      <div class="modal-dialog modal-xl"><div class="modal-content">
        <div class="modal-header"><h5 class="modal-title">New Purchase</h5><button class="btn-close" data-bs-dismiss="modal"></button></div>
        <div class="modal-body">
          <div class="row g-3 mb-3">
            <div class="col-md-4"><label class="form-label">Supplier *</label><select class="form-select" id="supplier_id" required></select></div>
            <div class="col-md-3"><label class="form-label">Purchase Date</label><input type="date" class="form-control" id="purchase_date"></div>
            <div class="col-md-3"><label class="form-label">Status</label><select class="form-select" id="status"><option value="draft">Draft</option><option value="ordered">Ordered</option></select></div>
            <div class="col-md-2"><label class="form-label">Paid Amount</label><input type="number" step="0.01" class="form-control" id="paid_amount" value="0"></div>
          </div>
          <div class="d-flex justify-content-between align-items-center mb-2">
            <h6>Items</h6>
            <button class="btn btn-sm btn-success" id="add-item-btn"><i class="fas fa-plus"></i> Add Item</button>
          </div>
          <div class="table-responsive mb-3">
            <table class="data-table" id="items-table">
              <thead><tr><th>Product</th><th style="width:100px">Qty</th><th style="width:120px">Unit Cost</th><th style="width:120px">Discount</th><th style="width:120px">Line Total</th><th style="width:50px"></th></tr></thead>
              <tbody id="items-body"></tbody>
            </table>
          </div>
          <div class="row g-3">
            <div class="col-md-6">
              <div class="mb-2"><label class="form-label">Discount</label><input type="number" step="0.01" class="form-control" id="discount_amount" value="0"></div>
              <div class="mb-2"><label class="form-label">Tax Amount</label><input type="number" step="0.01" class="form-control" id="tax_amount" value="0"></div>
              <div class="mb-2"><label class="form-label">Additional Cost (Shipping)</label><input type="number" step="0.01" class="form-control" id="additional_cost" value="0"></div>
              <div class="mb-2"><label class="form-label">Payment Method</label><select class="form-select" id="payment_method"><option value="cash">Cash</option><option value="card">Card</option><option value="mobile_banking">Mobile Banking</option><option value="bank_transfer">Bank Transfer</option></select></div>
              <div class="mb-2"><label class="form-label">Notes</label><textarea class="form-control" id="notes" rows="2"></textarea></div>
            </div>
            <div class="col-md-6">
              <div class="card"><div class="card-body">
                <div class="d-flex justify-content-between mb-2"><span>Subtotal:</span><strong id="calc-subtotal">৳0</strong></div>
                <div class="d-flex justify-content-between mb-2"><span>Discount:</span><strong id="calc-discount">৳0</strong></div>
                <div class="d-flex justify-content-between mb-2"><span>Tax:</span><strong id="calc-tax">৳0</strong></div>
                <div class="d-flex justify-content-between mb-2"><span>Additional:</span><strong id="calc-additional">৳0</strong></div>
                <hr><div class="d-flex justify-content-between"><span>Grand Total:</span><strong class="fs-5" id="calc-grand">৳0</strong></div>
                <div class="d-flex justify-content-between mt-2"><span>Paid:</span><strong id="calc-paid">৳0</strong></div>
                <div class="d-flex justify-content-between"><span>Due:</span><strong class="fs-5 text-danger" id="calc-due">৳0</strong></div>
              </div></div>
            </div>
          </div>
        </div>
        <div class="modal-footer"><button class="btn btn-secondary" data-bs-dismiss="modal">Cancel</button><button class="btn btn-primary" id="save-btn">Save Purchase</button></div>
      </div></div>
    </div>

    <div class="modal fade" id="view-modal" tabindex="-1">
      <div class="modal-dialog modal-lg"><div class="modal-content">
        <div class="modal-header"><h5 class="modal-title">Purchase Details</h5><button class="btn-close" data-bs-dismiss="modal"></button></div>
        <div class="modal-body" id="view-body"></div>
      </div></div>
    </div>
  </template>
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="/js/app.js"></script>
  <script src="/js/layout.js"></script>
  <script src="/js/purchases.js"></script>
</body>
</html>
