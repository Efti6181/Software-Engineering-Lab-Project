<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Returns - Business Inventory System</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css" rel="stylesheet">
  <link href="/css/style.css" rel="stylesheet">
</head>
<body>
  <div id="app-layout"></div>
  <template id="page-custom">
    <div class="container-fluid">
      <ul class="nav nav-tabs mb-3">
        <li class="nav-item"><button class="nav-link active" data-bs-toggle="tab" data-bs-target="#tab-sale-returns">Sales Returns</button></li>
        <li class="nav-item"><button class="nav-link" data-bs-toggle="tab" data-bs-target="#tab-purchase-returns">Purchase Returns</button></li>
      </ul>
      <div class="tab-content">
        <div class="tab-pane fade show active" id="tab-sale-returns">
          <div class="d-flex justify-content-between align-items-center mb-3">
            <h5 class="mb-0">Sales Returns</h5>
          </div>
          <div class="card">
            <div class="card-body table-card">
              <table class="data-table"><thead><tr><th>Number</th><th>Invoice</th><th>Customer</th><th>Date</th><th>Refund</th><th>Restock</th><th>Actions</th></tr></thead>
                <tbody id="sr-body"></tbody>
              </table>
              <div id="sr-pagination" class="mt-3"></div>
            </div>
          </div>
        </div>
        <div class="tab-pane fade" id="tab-purchase-returns">
          <div class="d-flex justify-content-between align-items-center mb-3">
            <h5 class="mb-0">Purchase Returns</h5>
          </div>
          <div class="card">
            <div class="card-body table-card">
              <table class="data-table"><thead><tr><th>Number</th><th>Purchase</th><th>Supplier</th><th>Date</th><th>Amount</th><th>Actions</th></tr></thead>
                <tbody id="pr-body"></tbody>
              </table>
              <div id="pr-pagination" class="mt-3"></div>
            </div>
          </div>
        </div>
      </div>
    </div>
    <div class="modal fade" id="sr-modal" tabindex="-1">
      <div class="modal-dialog modal-lg"><div class="modal-content">
        <div class="modal-header"><h5 class="modal-title">New Sale Return</h5><button class="btn-close" data-bs-dismiss="modal"></button></div>
        <div class="modal-body">
          <div class="mb-3"><label class="form-label">Sale Invoice</label><input type="text" class="form-control" id="sr-sale-id" placeholder="Enter sale ID"></div>
          <div id="sr-items-container"></div>
          <div class="mb-3"><label class="form-label">Reason</label><input type="text" class="form-control" id="sr-reason"></div>
          <div class="form-check mb-3"><input type="checkbox" class="form-check-input" id="sr-restock" checked><label class="form-check-label">Restock returned items</label></div>
        </div>
        <div class="modal-footer"><button class="btn btn-secondary" data-bs-dismiss="modal">Cancel</button><button class="btn btn-primary" id="sr-save">Process Return</button></div>
      </div></div>
    </div>
    <div class="modal fade" id="pr-modal" tabindex="-1">
      <div class="modal-dialog modal-lg"><div class="modal-content">
        <div class="modal-header"><h5 class="modal-title">New Purchase Return</h5><button class="btn-close" data-bs-dismiss="modal"></button></div>
        <div class="modal-body">
          <div class="mb-3"><label class="form-label">Purchase ID</label><input type="text" class="form-control" id="pr-purchase-id" placeholder="Enter purchase ID"></div>
          <div id="pr-items-container"></div>
          <div class="mb-3"><label class="form-label">Reason</label><input type="text" class="form-control" id="pr-reason"></div>
        </div>
        <div class="modal-footer"><button class="btn btn-secondary" data-bs-dismiss="modal">Cancel</button><button class="btn btn-primary" id="pr-save">Process Return</button></div>
      </div></div>
    </div>
    <div class="modal fade" id="view-sr-modal" tabindex="-1">
      <div class="modal-dialog modal-lg"><div class="modal-content">
        <div class="modal-header"><h5 class="modal-title">Return Details</h5><button class="btn-close" data-bs-dismiss="modal"></button></div>
        <div class="modal-body" id="view-sr-body"></div>
      </div></div>
    </div>
  </template>
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="/js/app.js"></script>
  <script src="/js/layout.js"></script>
  <script src="/js/returns.js"></script>
</body>
</html>
