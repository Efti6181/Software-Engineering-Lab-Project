<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Inventory - Business Inventory System</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css" rel="stylesheet">
  <link href="/css/style.css" rel="stylesheet">
</head>
<body>
  <div id="app-layout"></div>
  <template id="page-custom">
    <div class="container-fluid">
      <ul class="nav nav-tabs mb-3" role="tablist">
        <li class="nav-item"><button class="nav-link active" data-bs-toggle="tab" data-bs-target="#tab-stock">Stock Overview</button></li>
        <li class="nav-item"><button class="nav-link" data-bs-toggle="tab" data-bs-target="#tab-movements">Stock Movements</button></li>
      </ul>
      <div class="tab-content">
        <div class="tab-pane fade show active" id="tab-stock">
          <div class="d-flex justify-content-between align-items-center mb-3">
            <h4 class="mb-0">Inventory</h4>
            <button class="btn btn-primary" id="adjust-btn"><i class="fas fa-sliders-h"></i> New Adjustment</button>
          </div>
          <div class="card mb-3">
            <div class="card-body">
              <div class="row g-2">
                <div class="col-md-6"><input type="text" class="form-control" id="search" placeholder="Search products..."></div>
                <div class="col-md-3"><select class="form-select" id="filter-status">
                  <option value="">All Stock</option>
                  <option value="in_stock">In Stock</option>
                  <option value="low_stock">Low Stock</option>
                  <option value="out_of_stock">Out of Stock</option>
                </select></div>
                <div class="col-md-3"><button class="btn btn-outline-secondary w-100" id="search-btn"><i class="fas fa-search"></i> Search</button></div>
              </div>
            </div>
          </div>
          <div class="card">
            <div class="card-body table-card">
              <table class="data-table" id="inv-table">
                <thead><tr><th>Product</th><th>SKU</th><th>Category</th><th>Current Stock</th><th>Min Level</th><th>Stock Value</th><th>Status</th></tr></thead>
                <tbody id="inv-body"></tbody>
              </table>
              <div id="pagination" class="mt-3"></div>
            </div>
          </div>
        </div>
        <div class="tab-pane fade" id="tab-movements">
          <div class="d-flex justify-content-between align-items-center mb-3">
            <h4 class="mb-0">Stock Movements</h4>
            <select class="form-select" id="movement-filter" style="width:auto">
              <option value="">All Types</option>
              <option value="purchase">Purchase</option>
              <option value="sale">Sale</option>
              <option value="sale_return">Sale Return</option>
              <option value="purchase_return">Purchase Return</option>
              <option value="adjustment_in">Adjustment (+)</option>
              <option value="adjustment_out">Adjustment (-)</option>
              <option value="opening_stock">Opening Stock</option>
            </select>
          </div>
          <div class="card">
            <div class="card-body table-card">
              <table class="data-table" id="mov-table">
                <thead><tr><th>Date</th><th>Product</th><th>SKU</th><th>Type</th><th>Qty</th><th>Prev Stock</th><th>New Stock</th><th>Notes</th><th>User</th></tr></thead>
                <tbody id="mov-body"></tbody>
              </table>
              <div id="mov-pagination" class="mt-3"></div>
            </div>
          </div>
        </div>
      </div>
    </div>

    <div class="modal fade" id="adjust-modal" tabindex="-1">
      <div class="modal-dialog"><div class="modal-content">
        <div class="modal-header"><h5 class="modal-title">Stock Adjustment</h5><button class="btn-close" data-bs-dismiss="modal"></button></div>
        <div class="modal-body"><form id="adjust-form">
          <div class="mb-3"><label class="form-label">Product *</label><select class="form-select" id="adj-product" required></select></div>
          <div class="mb-3"><label class="form-label">Reason *</label><select class="form-select" id="adj-reason" required>
            <option value="damaged">Damaged</option><option value="lost">Lost</option><option value="found">Found</option>
            <option value="correction">Correction</option><option value="opening_stock">Opening Stock</option><option value="other">Other</option>
          </select></div>
          <div class="mb-3"><label class="form-label">Quantity Change * <small class="text-muted">(use negative for decrease, e.g. -5)</label><input type="number" step="0.01" class="form-control" id="adj-qty" required></div>
          <div class="mb-3"><label class="form-label">Notes</label><textarea class="form-control" id="adj-notes" rows="2"></textarea></div>
        </form></div>
        <div class="modal-footer"><button class="btn btn-secondary" data-bs-dismiss="modal">Cancel</button><button class="btn btn-primary" id="adj-save">Apply Adjustment</button></div>
      </div></div>
    </div>
  </template>
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="/js/app.js"></script>
  <script src="/js/layout.js"></script>
  <script src="/js/inventory.js"></script>
</body>
</html>
