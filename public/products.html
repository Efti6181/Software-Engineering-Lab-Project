<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Products - Business Inventory System</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css" rel="stylesheet">
  <link href="/css/style.css" rel="stylesheet">
</head>
<body>
  <div id="app-layout"></div>
  <template id="page-custom">
    <div class="container-fluid">
      <div class="d-flex justify-content-between align-items-center mb-3">
        <h4 class="mb-0">Products</h4>
        <div>
          <button class="btn btn-outline-secondary me-2" id="archived-btn"><i class="fas fa-archive"></i> Archived</button>
          <button class="btn btn-primary" id="add-btn"><i class="fas fa-plus"></i> Add Product</button>
        </div>
      </div>
      <div class="card mb-3">
        <div class="card-body">
          <div class="row g-2">
            <div class="col-md-4"><input type="text" class="form-control" id="search" placeholder="Search by name, SKU or barcode..."></div>
            <div class="col-md-2"><select class="form-select" id="filter-category"><option value="">All Categories</option></select></div>
            <div class="col-md-2"><select class="form-select" id="filter-brand"><option value="">All Brands</option></select></div>
            <div class="col-md-2"><select class="form-select" id="filter-status"><option value="">All Status</option><option value="active">Active</option><option value="inactive">Inactive</option></select></div>
            <div class="col-md-2"><button class="btn btn-outline-secondary w-100" id="search-btn"><i class="fas fa-search"></i> Search</button></div>
          </div>
        </div>
      </div>
      <div class="card">
        <div class="card-body table-card">
          <table class="data-table" id="data-table">
            <thead><tr><th>Image</th><th>Name</th><th>SKU</th><th>Category</th><th>Brand</th><th>Purchase</th><th>Selling</th><th>Stock</th><th>Status</th><th>Actions</th></tr></thead>
            <tbody id="data-body"></tbody>
          </table>
          <div id="pagination" class="mt-3"></div>
        </div>
      </div>
    </div>

    <div class="modal fade" id="form-modal" tabindex="-1">
      <div class="modal-dialog modal-lg"><div class="modal-content">
        <div class="modal-header"><h5 class="modal-title" id="modal-title">Add Product</h5><button class="btn-close" data-bs-dismiss="modal"></button></div>
        <div class="modal-body"><form id="product-form">
          <input type="hidden" id="edit-id">
          <div class="row g-3">
            <div class="col-md-6"><label class="form-label">Product Name *</label><input type="text" class="form-control" id="name" required></div>
            <div class="col-md-3"><label class="form-label">SKU *</label><input type="text" class="form-control" id="sku" required></div>
            <div class="col-md-3"><label class="form-label">Barcode</label><input type="text" class="form-control" id="barcode"></div>
            <div class="col-md-4"><label class="form-label">Category</label><select class="form-select" id="category_id"></select></div>
            <div class="col-md-4"><label class="form-label">Brand</label><select class="form-select" id="brand_id"></select></div>
            <div class="col-md-4"><label class="form-label">Preferred Supplier</label><select class="form-select" id="preferred_supplier_id"></select></div>
            <div class="col-md-3"><label class="form-label">Purchase Price *</label><input type="number" step="0.01" class="form-control" id="purchase_price" value="0" required></div>
            <div class="col-md-3"><label class="form-label">Selling Price *</label><input type="number" step="0.01" class="form-control" id="selling_price" value="0" required></div>
            <div class="col-md-3"><label class="form-label">Opening Stock</label><input type="number" step="0.01" class="form-control" id="current_stock" value="0"></div>
            <div class="col-md-3"><label class="form-label">Min Stock Level</label><input type="number" class="form-control" id="min_stock_level" value="5"></div>
            <div class="col-md-4"><label class="form-label">Unit</label><input type="text" class="form-control" id="unit" value="pcs"></div>
            <div class="col-md-4"><label class="form-label">Status</label><select class="form-select" id="status"><option value="active">Active</option><option value="inactive">Inactive</option></select></div>
            <div class="col-md-4"><label class="form-label">Image URL</label><input type="text" class="form-control" id="image_url" placeholder="/uploads/..."></div>
            <div class="col-12"><label class="form-label">Description</label><textarea class="form-control" id="description" rows="2"></textarea></div>
          </div>
        </form></div>
        <div class="modal-footer"><button class="btn btn-secondary" data-bs-dismiss="modal">Cancel</button><button class="btn btn-primary" id="save-btn">Save</button></div>
      </div></div>
    </div>
  </template>
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="/js/app.js"></script>
  <script src="/js/layout.js"></script>
  <script src="/js/products.js"></script>
</body>
</html>
