<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Expenses - Business Inventory System</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css" rel="stylesheet">
  <link href="/css/style.css" rel="stylesheet">
</head>
<body>
  <div id="app-layout"></div>
  <template id="page-custom">
    <div class="container-fluid">
      <div class="d-flex justify-content-between align-items-center mb-3">
        <h4 class="mb-0">Expenses</h4>
        <button class="btn btn-primary" id="add-btn"><i class="fas fa-plus"></i> Add Expense</button>
      </div>
      <div class="card mb-3">
        <div class="card-body">
          <div class="row g-2">
            <div class="col-md-6"><input type="text" class="form-control" id="search" placeholder="Search expenses..."></div>
            <div class="col-md-3"><select class="form-select" id="filter-category"><option value="">All Categories</option></select></div>
            <div class="col-md-3"><button class="btn btn-outline-secondary w-100" id="search-btn"><i class="fas fa-search"></i> Search</button></div>
          </div>
        </div>
      </div>
      <div class="card">
        <div class="card-body table-card">
          <table class="data-table" id="data-table">
            <thead><tr><th>Number</th><th>Category</th><th>Amount</th><th>Date</th><th>Method</th><th>Description</th><th>Created By</th><th>Actions</th></tr></thead>
            <tbody id="data-body"></tbody>
          </table>
          <div id="pagination" class="mt-3"></div>
        </div>
      </div>
    </div>
    <div class="modal fade" id="form-modal" tabindex="-1">
      <div class="modal-dialog"><div class="modal-content">
        <div class="modal-header"><h5 class="modal-title" id="modal-title">Add Expense</h5><button class="btn-close" data-bs-dismiss="modal"></button></div>
        <div class="modal-body"><form id="expense-form">
          <input type="hidden" id="edit-id">
          <div class="mb-3"><label class="form-label">Category</label><select class="form-select" id="category_id"></select></div>
          <div class="mb-3"><label class="form-label">Amount *</label><input type="number" step="0.01" class="form-control" id="amount" required></div>
          <div class="mb-3"><label class="form-label">Date</label><input type="date" class="form-control" id="expense_date"></div>
          <div class="mb-3"><label class="form-label">Payment Method</label><select class="form-select" id="payment_method"><option value="cash">Cash</option><option value="card">Card</option><option value="mobile_banking">Mobile Banking</option><option value="bank_transfer">Bank Transfer</option></select></div>
          <div class="mb-3"><label class="form-label">Description</label><textarea class="form-control" id="description" rows="2"></textarea></div>
        </form></div>
        <div class="modal-footer"><button class="btn btn-secondary" data-bs-dismiss="modal">Cancel</button><button class="btn btn-primary" id="save-btn">Save</button></div>
      </div></div>
    </div>
  </template>
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="/js/app.js"></script>
  <script src="/js/layout.js"></script>
  <script src="/js/expenses.js"></script>
</body>
</html>
