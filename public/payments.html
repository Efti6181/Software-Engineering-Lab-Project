<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Payments & Dues - Business Inventory System</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css" rel="stylesheet">
  <link href="/css/style.css" rel="stylesheet">
</head>
<body>
  <div id="app-layout"></div>
  <template id="page-custom">
    <div class="container-fluid">
      <ul class="nav nav-tabs mb-3">
        <li class="nav-item"><button class="nav-link active" data-bs-toggle="tab" data-bs-target="#tab-dues">Outstanding Dues</button></li>
        <li class="nav-item"><button class="nav-link" data-bs-toggle="tab" data-bs-target="#tab-payments">Payment History</button></li>
      </ul>
      <div class="tab-content">
        <div class="tab-pane fade show active" id="tab-dues">
          <div class="row g-3">
            <div class="col-lg-6">
              <div class="card">
                <div class="card-header"><h5 class="mb-0"><i class="fas fa-users"></i> Customer Dues</h5></div>
                <div class="card-body table-card">
              <table class="data-table"><thead><tr><th>Invoice</th><th>Customer</th><th>Total</th><th>Paid</th><th>Due</th><th>Action</th></tr></thead>
                <tbody id="customer-dues-body"></tbody>
              </table>
                </div>
              </div>
            </div>
            <div class="col-lg-6">
              <div class="card">
                <div class="card-header"><h5 class="mb-0"><i class="fas fa-truck"></i> Supplier Dues</h5></div>
                <div class="card-body table-card">
              <table class="data-table"><thead><tr><th>Purchase</th><th>Supplier</th><th>Total</th><th>Paid</th><th>Due</th><th>Action</th></tr></thead>
                <tbody id="supplier-dues-body"></tbody>
              </table>
                </div>
              </div>
            </div>
          </div>
        </div>
        <div class="tab-pane fade" id="tab-payments">
          <div class="card">
            <div class="card-body table-card">
              <table class="data-table"><thead><tr><th>Number</th><th>Type</th><th>Party</th><th>Amount</th><th>Method</th><th>Date</th><th>Reference</th></tr></thead>
                <tbody id="payments-body"></tbody>
              </table>
              <div id="pagination" class="mt-3"></div>
            </div>
          </div>
        </div>
      </div>
    </div>
    <div class="modal fade" id="pay-modal" tabindex="-1">
      <div class="modal-dialog"><div class="modal-content">
        <div class="modal-header"><h5 class="modal-title">Record Payment</h5><button class="btn-close" data-bs-dismiss="modal"></button></div>
        <div class="modal-body"><form id="pay-form">
          <input type="hidden" id="pay-party-type"><input type="hidden" id="pay-party-id"><input type="hidden" id="pay-ref-type"><input type="hidden" id="pay-ref-id">
          <div class="mb-3"><label class="form-label">Amount *</label><input type="number" step="0.01" class="form-control" id="pay-amount" required></div>
          <div class="mb-3"><label class="form-label">Payment Method</label><select class="form-select" id="pay-method"><option value="cash">Cash</option><option value="card">Card</option><option value="mobile_banking">Mobile Banking</option><option value="bank_transfer">Bank Transfer</option></select></div>
          <div class="mb-3"><label class="form-label">Reference</label><input type="text" class="form-control" id="pay-reference"></div>
          <div class="mb-3"><label class="form-label">Notes</label><textarea class="form-control" id="pay-notes" rows="2"></textarea></div>
        </form></div>
        <div class="modal-footer"><button class="btn btn-secondary" data-bs-dismiss="modal">Cancel</button><button class="btn btn-primary" id="pay-save">Record Payment</button></div>
      </div></div>
    </div>
  </template>
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="/js/app.js"></script>
  <script src="/js/layout.js"></script>
  <script src="/js/payments.js"></script>
</body>
</html>
